*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}

#incomingCall{display:none;position:fixed;top:10px;left:10px;right:10px;background:#1e293b;border:2px solid #0ea5e9;border-radius:14px;padding:12px;z-index:9998;box-shadow:0 10px 30px rgba(0,0,0,.6)}

#debug{padding:4px 10px;background:#1e293b;font-size:9px;color:#fbbf24;border-top:1px solid #334155;max-height:50px;overflow-y:auto}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:10000;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px;text-align:center}
.modal.show{display:flex}

.modal button{padding:12px 18px;border-radius:20px;border:none;background:#0ea5e9;color:white;font-weight:bold;font-size:14px;margin:4px}
#qrImg{width:min(88vw,55vh);image-rendering:pixelated;background:#fff;border-radius:8px}
#scanUI{z-index:10001;padding:0;justify-content:flex-start}

#imgViewer{z-index:10002}
#imgViewer img{max-width:100%;max-height:100%}
</style>

<script>
// ===== تحميل المكتبات: من التطبيق (محلي) وإلا من الإنترنت =====
function loadLib(local,cdn){
  const s=document.createElement('script');
  s.src=local;
  s.onerror=()=>{ const c=document.createElement('script'); c.src=cdn; document.head.appendChild(c); };
  document.head.appendChild(s);
}
loadLib('lib/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');
loadLib('lib/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js');
loadLib('lib/qrcode.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js');
</script>

<script>
let peer=null, peerErrHandler=null;
let myId='', myName='مستخدم', currentRoom='', currentMode='online', currentTab='group', selectedPrivatePeer=null;
let messages={group:[], private:{}};
let connections={}, links={}, peersInfo={};
let isHost=false, roomHostId='';
let localStream=null, currentCall=null, incomingCall=null, callTimerInt=null, isMuted=false, isVideoOff=false, pendingLink=null;

const $=id=>document.getElementById(id);
const RTC_CFG={iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
]};

// ============ Crypto ============
const enc=new TextEncoder(), dec=new TextDecoder();
let roomKey=null, myKeyPair=null, myPubB64='', peerKeys={}, authed={}, seen=new Set();
function b64e(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function b64d(s){ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
const rid=()=>b64e(crypto.getRandomValues(new Uint8Array(9)));
const hex=u=>Array.from(new Uint8Array(u)).map(b=>b.toString(16).padStart(2,'0')).join('');
async function deriveRoom(room,pass){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey','deriveBits']);
  roomKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('sc1-key:'+room),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('sc1-id:'+room),iterations:250000,hash:'SHA-256'},base,128);
  return hex(bits);
}
async function seal(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return {iv:b64e(iv),ct:b64e(ct)};
}
async function unseal(key,p){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(p.iv)},key,b64d(p.ct));
  return JSON.parse(dec.decode(pt));
}
async function initKeys(){
  myKeyPair=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
  myPubB64=b64e(await crypto.subtle.exportKey('raw',myKeyPair.publicKey));
}
async function pairKey(pid){
  const info=peersInfo[pid];
  if(!info||!info.pub) throw new Error('no key');
  if(peerKeys[pid]&&peerKeys[pid].pub===info.pub) return peerKeys[pid].aes;
  const pub=await crypto.subtle.importKey('raw',b64d(info.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const aes=await crypto.subtle.deriveKey({name:'ECDH',public:pub},myKeyPair.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  peerKeys[pid]={pub:info.pub,aes};
  return aes;
}
async function safetyCode(pid){
  const a=peersInfo[myId]&&peersInfo[myId].pub, b=peersInfo[pid]&&peersInfo[pid].pub;
  if(!a||!b) return '';
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode([a,b].sort().join('|'))));
  const n=[]; for(let i=0;i<6;i++) n.push(String(((h[i*2]<<8)|h[i*2+1])%1000).padStart(3,'0'));
  return n.join(' ');
}

// ============ Utils ============
function log(t){ $('debug').textContent=new Date().toLocaleTimeString()+' - '+t; console.log(t); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function updateStatus(text,color){ const s=$('status'); s.textContent=text; s.style.background=color; }
function genId(){ return 'sherif-'+Math.random().toString(36).slice(2,7)+'-'+Date.now().toString().slice(-4); }
function nowTime(){ return new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); }
function getName(){ return ($('nameInput').value.trim()||'مستخدم').slice(0,20); }
function updateNetType(){ $('netType').textContent=currentMode==='offline'?'📶 بدون نت':'🌐 بنت'; }
window.viewImg=src=>{ $('viewerImg').src=src; $('imgViewer').classList.add('show'); };

// ============ Ring ============
let ringTimer=null, actx=null;
function ringStart(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const beep=()=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=880; g.gain.value=0.2; o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+0.4);
      if(navigator.vibrate) navigator.vibrate(400);
    };
    beep(); ringTimer=setInterval(beep,1500);
    setTimeout(ringStop,25000);
  }catch{}
}
function ringStop(){ if(ringTimer){ clearInterval(ringTimer); ringTimer=null; } }

// ============ Mode / session ============
function resetSession(){
  if(currentCall||localStream) endCall(false);
  clearIncoming();
  try{ if(peer) peer.destroy(); }catch{} peer=null; peerErrHandler=null;
  Object.values(links).forEach(L=>{ L.dropped=true; try{L.pc.close()}catch{} });
  if(pendingLink){ try{pendingLink.pc.close()}catch{} pendingLink=null; }
  links={}; connections={}; peersInfo={}; authed={}; peerKeys={}; seen=new Set();
  isHost=false; roomKey=null; selectedPrivatePeer=null; myId='';
  messages={group:[], private:{}};
  closeQR(); stopScan();
  updateStatus('● غير متصل','#6b7280');
  updatePeers(); render();
}
function applyModeUI(){
  const off=currentMode==='offline';
  $('onBar').style.display=off?'none':'flex';
  $('offBar').style.display=off?'flex':'none';
  if(off){
    myId=genId(); myName=getName();
    peersInfo={}; peersInfo[myId]={name:myName};
    $('myIdShow').textContent='ID: '+myId.slice(0,14);
    updateStatus('● بدون نت - جاهز','#0ea5e9');
    log('اضغط "إنشاء اتصال" على جهاز، و"انضمام" على الجهاز التاني (لازم على نفس الواي فاي/الهوت سبوت)');
    updatePeers();
  } else {
    $('myIdShow').textContent='ID: ...';
    log('اكتب اسم الغرفة وكلمة السر ثم دخول');
  }
  updateNetType();
}
window.setMode=m=>{
  currentMode=m;
  document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===m));
  resetSession(); applyModeUI();
};

// ============ Online (PeerJS) ============
function createPeer(id, onOpen){
  if(typeof Peer==='undefined'){ alert('مكتبة PeerJS لسه ما اتحملتش، جرب تاني'); return; }
  if(peer){ try{peer.destroy()}catch{} }
  connections={};
  peer=new Peer(id||undefined,{debug:1,config:RTC_CFG});
  peer.on('open', pid=>{
    myId=pid;
    $('myIdShow').textContent='ID: '+myId.slice(0,16);
    onOpen&&onOpen();
  });
  peer.on('connection', conn=>{
    log('اتصال جديد من '+conn.peer.slice(0,10));
    wire(conn);
    setTimeout(()=>{ if(isHost && !authed[conn.peer]){ try{conn.close()}catch{} } },6000);
  });
  peer.on('call', onIncomingCall);
  peer.on('error', err=>{ if(peerErrHandler) peerErrHandler(err); else log('Peer error: '+err.type); });
  peer.on('disconnected', ()=>{ try{peer.reconnect()}catch{} });
}

function wire(conn, onOpen){
  const pid=conn.peer;
  conn.on('data', d=>handleData(d,pid,conn));
  conn.on('close', ()=>dropPeer(pid));
  conn.on('error', e=>log('خطأ اتصال: '+e));
  const opened=()=>{ connections[pid]=conn; onOpen&&onOpen(); };
  if(conn.open) opened(); else conn.on('open', opened);
}

function dropPeer(pid){
  delete connections[pid]; delete peersInfo[pid]; delete authed[pid]; delete peerKeys[pid];
  updatePeers();
  if(isHost) broadcast({type:'peer-left', peer:pid});
  else if(pid===roomHostId){ updateStatus('● الـ Host قطع','#ef4444'); log('الـ Host قطع - اضغط دخول تاني'); }
}

async function sendTo(conn,obj){
  if(!conn||!conn.open||!roomKey) return;
  try{ conn.send({e:await seal(roomKey,obj)}); }catch(e){ log('فشل ارسال'); }
}
async function broadcast(obj, exclude=null){
  for(const c of Object.values(connections)){
    if(c.peer===exclude) continue;
    if(isHost && !authed[c.peer]) continue;
    await sendTo(c,obj);
  }
}
function relayRaw(pkt, exclude){
  Object.values(connections).forEach(c=>{
    if(c.peer!==exclude && c.open && authed[c.peer]){ try{c.send(pkt)}catch{} }
  });
}

async function handleData(pkt, from, conn){
  if(!pkt||!pkt.e||!roomKey) return;
  let data;
  try{ data=await unseal(roomKey,pkt.e); }
  catch{ log('🚫 رسالة مرفوضة (كلمة سر غلط أو تلاعب)'); if(isHost){ try{conn.close()}catch{} } return; }
  if(!data||typeof data!=='object') return;
  if(data.id){ if(seen.has(data.id)) return; seen.add(data.id); if(seen.size>3000) seen.clear(); }

  if(data.type==='hello'){
    if(!isHost||typeof data.pub!=='string') return;
    authed[from]=true;
    const name=String(data.name||'').slice(0,20)||from.slice(0,8);
    peersInfo[from]={name,pub:data.pub};
    await sendTo(conn,{type:'peers-list',peers:peersInfo});
    await broadcast({type:'peer-joined',peer:from,name,pub:data.pub},from);
    messages.group.push({type:'chat',text:'✅ '+name+' دخل',from:'system'});
    updatePeers(); render();
    return;
  }
  if(isHost && !authed[from]) return;

  if(data.type==='peers-list' && !isHost){
    peersInfo=data.peers||{};
    peersInfo[myId]={name:myName,pub:myPubB64};
    updatePeers();
  } else if(data.type==='peer-joined' && !isHost){
    peersInfo[data.peer]={name:String(data.name||'').slice(0,20),pub:data.pub};
    messages.group.push({type:'chat',text:'✅ '+peersInfo[data.peer].name+' دخل',from:'system'});
    updatePeers(); render();
  } else if(data.type==='peer-left' && !isHost){
    delete peersInfo[data.peer]; delete peerKeys[data.peer];
    updatePeers();
  } else if(data.type==='chat'){
    if(isHost){
      if(data.from!==from) return;
      if(data.isPrivate){
        if(data.to!==myId){
          const c=connections[data.to];
          if(c&&c.open&&authed[data.to]) c.send(pkt);
          return;
        }
      } else relayRaw(pkt,from);
    }
    if(data.isPrivate){
      try{
        const inner=await unseal(await pairKey(data.from),data.body);
        const msg={type:'chat',from:data.from,fromName:String(inner.fromName||'').slice(0,20),text:String(inner.text||''),time:inner.time||nowTime(),isPrivate:true};
        (messages.private[data.from]=messages.private[data.from]||[]).push(msg);
      }catch(e){ log('🚫 فشل فك رسالة فردية'); return; }
    } else messages.group.push(data);
    render();
  }
}

// ============ Offline (QR / WebRTC مباشر) ============
async function pack(obj){
  let bytes=enc.encode(JSON.stringify(obj)), tag='R';
  if(window.CompressionStream){
    const cs=new CompressionStream('deflate-raw'), w=cs.writable.getWriter();
    w.write(bytes); w.close();
    bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer()); tag='Z';
  }
  return 'SC1'+tag+b64e(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpack(t){
  t=String(t).trim();
  if(!t.startsWith('SC1')) throw new Error('مش كود التطبيق');
  const tag=t[3]; let s=t.slice(4).replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  let bytes=b64d(s);
  if(tag==='Z'){
    const ds=new DecompressionStream('deflate-raw'), w=ds.writable.getWriter();
    w.write(bytes); w.close();
    bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  return JSON.parse(dec.decode(bytes));
}
function filterSdp(sdp){
  const lines=sdp.split(/\r?\n/).filter(Boolean);
  const out=lines.filter(l=>!(l.startsWith('a=candidate:') && (l.split(' ')[4]||'').includes(':')));
  return (out.some(l=>l.startsWith('a=candidate:'))?out:lines).join('\r\n')+'\r\n';
}
function gathered(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    const t=setTimeout(res,4000);
    pc.addEventListener('icegatheringstatechange',()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); res(); } });
  });
}
async function holdMic(){ try{ return await navigator.mediaDevices.getUserMedia({audio:true}); }catch{ return null; } }

function newLink(){
  const pc=new RTCPeerConnection({iceServers:[]});
  const L={pc,dc:null,peerId:null,dropped:false};
  pc.onconnectionstatechange=()=>{
    log('اتصال مباشر: '+pc.connectionState);
    if(pc.connectionState==='failed'||pc.connectionState==='closed') dropLink(L);
    else if(pc.connectionState==='disconnected') setTimeout(()=>{ if(pc.connectionState==='disconnected') dropLink(L); },8000);
  };
  pc.ontrack=e=>{
    const rv=$('remoteVideo');
    rv.srcObject=e.streams[0]||new MediaStream([e.track]);
    rv.play().catch(()=>{});
  };
  return L;
}
function bindDC(L,dc){
  L.dc=dc;
  dc.onopen=()=>sendL(L,{type:'hello',id:myId,name:myName});
  dc.onmessage=e=>{ try{ onOffData(JSON.parse(e.data),L); }catch(err){ log('رسالة تالفة'); } };
  dc.onclose=()=>dropLink(L);
  if(dc.readyState==='open') dc.onopen();
}
function sendL(L,obj){
  if(L&&L.dc&&L.dc.readyState==='open'){ try{ L.dc.send(JSON.stringify(obj)); return true; }catch(e){ log('فشل إرسال'); } }
  return false;
}
function dropLink(L){
  if(L.dropped) return; L.dropped=true;
  try{L.pc.close()}catch{}
  if(L.peerId){
    const name=(peersInfo[L.peerId]&&peersInfo[L.peerId].name)||'حد';
    delete links[L.peerId]; delete peersInfo[L.peerId];
    if(selectedPrivatePeer===L.peerId) selectedPrivatePeer=null;
    if(currentCall&&currentCall.link===L) endCall(false);
    messages.group.push({type:'chat',text:'❌ '+name+' خرج',from:'system'});
    updatePeers(); render();
  }
}

function onOffData(d,L){
  if(!d||!d.type) return;
  if(d.type==='hello'){
    if(L.peerId) return;
    L.peerId=String(d.id);
    links[L.peerId]=L;
    peersInfo[L.peerId]={name:String(d.name||'').slice(0,20)||'مستخدم'};
    messages.group.push({type:'chat',text:'✅ '+peersInfo[L.peerId].name+' اتصل',from:'system'});
    updateStatus('● متصل 🔒','#16a34a');
    closeQR(); stopScan(); pendingLink=null;
    updatePeers(); render();
  } else if(d.type==='chat'){
    if(d.id){ if(seen.has(d.id)) return; seen.add(d.id); if(seen.size>3000) seen.clear(); }
    if(d.isPrivate){
      if(d.to!==myId) return;
      (messages.private[L.peerId]=messages.private[L.peerId]||[]).push(d);
    } else {
      messages.group.push(d);
      Object.values(links).forEach(x=>{ if(x!==L) sendL(x,d); });
    }
    render();
  } else if(d.type==='sdp'||d.type.startsWith('call-')){
    offCallSignal(d,L);
  }
}

let scanStream=null, scanRAF=0;
async function scanQR(cb){
  if(typeof jsQR==='undefined'){ alert('مكتبة المسح لسه ما اتحملتش، جرب تاني'); return; }
  try{ scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ alert('محتاج إذن الكاميرا'); return; }
  const v=$('scanVideo'); v.srcObject=scanStream;
  try{ await v.play(); }catch{}
  $('scanUI').classList.add('show');
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=()=>{
    if(!scanStream) return;
    if(v.videoWidth){
      const k=Math.min(1,640/v.videoWidth);
      cv.width=Math.round(v.videoWidth*k); cv.height=Math.round(v.videoHeight*k);
      cx.drawImage(v,0,0,cv.width,cv.height);
      const img=cx.getImageData(0,0,cv.width,cv.height);
      const r=jsQR(img.data,cv.width,cv.height,{inversionAttempts:'dontInvert'});
      if(r&&r.data){ stopScan(); cb(r.data); return; }
    }
    scanRAF=requestAnimationFrame(tick);
  };
  tick();
}
window.stopScan=()=>{
  cancelAnimationFrame(scanRAF);
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  $('scanUI').classList.remove('show'); $('scanVideo').srcObject=null;
};

async function offStartCall(pid,video){
  const L=links[pid];
  if(!L){ alert('مش متصل بيه'); return; }
  try{ localStream=await getMedia(video); }
  catch(e){ if(e.message!=='insecure context') alert('محتاج إذن كاميرا/ميك: '+e.message); return; }
  currentCall={offline:true,link:L,video,role:'caller'};
  showCallUI(video,(peersInfo[pid]&&peersInfo[pid].name)||'');
  sendL(L,{type:'call-req',video,name:myName});
  log('بيرن...');
}
async function offCallSignal(d,L){
  try{
    if(d.type==='call-req'){
      if(currentCall||incomingCall){ sendL(L,{type:'call-reject'}); return; }
      incomingCall={offline:true,link:L,peer:L.peerId,metadata:{video:!!d.video,fromName:String(d.name||'').slice(0,20)}};
      showIncoming(incomingCall);
    } else if(d.type==='call-accept'){
      if(!currentCall||currentCall.link!==L||currentCall.role!=='caller') return;
      localStream.getTracks().forEach(t=>L.pc.addTrack(t,localStream));
      await L.pc.setLocalDescription(await L.pc.createOffer());
      sendL(L,{type:'sdp',desc:{type:'offer',sdp:L.pc.localDescription.sdp}});
      startTimer();
    } else if(d.type==='sdp'){
      if(d.desc.type==='offer'){
        await L.pc.setRemoteDescription(d.desc);
        await L.pc.setLocalDescription(await L.pc.createAnswer());
        sendL(L,{type:'sdp',desc:{type:'answer',sdp:L.pc.localDescription.sdp}});
      } else await L.pc.setRemoteDescription(d.desc);
    } else if(d.type==='call-reject'){
      if(currentCall&&currentCall.link===L){ alert('المكالمة اترفضت'); endCall(false); }
    } else if(d.type==='call-end'){
      if(incomingCall&&incomingCall.link===L) clearIncoming();
      if(currentCall&&currentCall.link===L) endCall(false);
    }
  }catch(e){ log('خطأ مكالمة: '+e.message); }
}

    const data={type:'chat',id:rid(),text,time,from:myId,fromName:myName,isPrivate:priv,to:priv?selectedPrivatePeer:null};

  }
  input.value=''; render();
  deliver(data);
};

function compressImage(file, cb){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'), max=640;
      let w=img.width, h=img.height;
      if(w>h){ if(w>max){ h*=max/w; w=max; } } else { if(h>max){ w*=max/h; h=max; } }
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.6, out=c.toDataURL('image/jpeg',q);
      while(out.length>150000 && q>0.25){ q-=0.1; out=c.toDataURL('image/jpeg',q); }
      cb(out);
    };
    img.onerror=()=>cb(null);
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

    return Promise.reject(new Error('insecure context'));
  }
  return navigator.mediaDevices.getUserMedia({video, audio:true});
}
function showCallUI(video,name){

window.startCall=async(video=false)=>{

    log('فشل المكالمة: '+e.message);
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
    $('callUI').classList.remove('show');
    if(e.message!=='insecure context') alert('محتاج إذن كاميرا/ميك: '+e.message);

};

function showIncoming(call){

function onIncomingCall(call){

function clearIncoming(){

}

function handleCall(call){
  currentCall=call;
  call.on('stream', s=>{ const rv=$('remoteVideo'); rv.srcObject=s; rv.play().catch(()=>{}); });
  call.on('close', ()=>endCall(false));
  call.on('error', e=>{ log('خطأ مكالمة: '+e); endCall(false); });
}

window.acceptCall=async()=>{
  const call=incomingCall;
  if(!call) return;
  clearIncoming();
  const video=!!(call.metadata&&call.metadata.video);
  const name=(call.metadata&&call.metadata.fromName)||(peersInfo[call.peer]&&peersInfo[call.peer].name)||'';
  try{
    localStream=await getMedia(video);
    if(call.offline){
      const L=call.link;
      localStream.getTracks().forEach(t=>L.pc.addTrack(t,localStream));
      currentCall={offline:true,link:L,video,role:'callee'};
      showCallUI(video,name);
      sendL(L,{type:'call-accept'});
      startTimer();
    } else {
      showCallUI(video,name);
      call.answer(localStream);
      handleCall(call);
      startTimer();
    }
  }catch(e){
    if(call.offline) sendL(call.link,{type:'call-reject'}); else { try{call.close()}catch{} }
    if(e.message!=='insecure context') alert('محتاج إذن: '+e.message);
  }
};
window.rejectCall=()=>{
  const c=incomingCall;
  clearIncoming();
  if(!c) return;
  if(c.offline) sendL(c.link,{type:'call-reject'}); else { try{c.close()}catch{} }
};

function startTimer(){
  let sec=0;
  if(callTimerInt) clearInterval(callTimerInt);
  $('callTimer').textContent='00:00';
  callTimerInt=setInterval(()=>{
    sec++;
    $('callTimer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  },1000);
}

window.endCall=(sig)=>{
  if(callTimerInt){ clearInterval(callTimerInt); callTimerInt=null; }
  $('callUI').classList.remove('show');
  const c=currentCall; currentCall=null;
  if(c){
    if(c.offline){
      if(sig!==false) sendL(c.link,{type:'call-end'});
      try{ c.link.pc.getSenders().forEach(s=>{ if(s.track) c.link.pc.removeTrack(s); }); }catch{}
    } else { try{c.close()}catch{} }
  }
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  localStream=null; isMuted=false; isVideoOff=false;
  $('muteBtn').textContent='🎤'; $('muteBtn').style.background='#334155';
  $('videoBtn').textContent='🎥';
  $('localVideo').srcObject=null; $('remoteVideo').srcObject=null;
};

window.toggleMute=()=>{
  if(!localStream) return;
  isMuted=!isMuted;
  localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);
  $('muteBtn').textContent=isMuted?'🔇':'🎤';
  $('muteBtn').style.background=isMuted?'#ef4444':'#334155';
};
window.toggleVideo=()=>{
  if(!localStream) return;
  const vt=localStream.getVideoTracks()[0];
  if(!vt) return;
  isVideoOff=!isVideoOff;
  vt.enabled=!isVideoOff;
  $('videoBtn').textContent=isVideoOff?'📷':'🎥';
};

applyModeUI();
</script>
