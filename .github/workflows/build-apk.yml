name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 peerjs@1.5.4 jsqr@1.4.0 qrcode-generator@1.4.4
          cp node_modules/peerjs/dist/peerjs.min.js www/lib/
          cp node_modules/jsqr/dist/jsQR.js www/lib/
          cp node_modules/qrcode-generator/qrcode.js www/lib/
          npx cap init "Sherif Chat" com.sherif.chat --web-dir=www
          npx cap add android
      - name: Add permissions
        run: |
          python3 - <<'EOF'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          names=['CAMERA','RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','ACCESS_NETWORK_STATE','ACCESS_WIFI_STATE','CHANGE_WIFI_STATE']
          perms=''.join('    <uses-permission android:name="android.permission.%s" />\n'%n for n in names)
          s=s.replace('</manifest>',perms+'</manifest>')
          open(p,'w').write(s)
